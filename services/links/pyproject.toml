[project]
name = "link-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers[rabbitmq,redis]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: tests that need real external services",
    "docker: tests that need real Docker containers",
]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 100
force_grid_wrap = 2
src_paths = ["src"]
skip_gitignore = true
